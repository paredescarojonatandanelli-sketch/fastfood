{% extends "base.html" %}

{% block title %}Carrito - {{ config.BUSINESS_NAME }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4">Tu Carrito</h2>

    <div id="cart-items"></div>

    <div id="cart-summary" class="mt-4"></div>

    <div id="cart-empty" class="text-center text-muted py-5" style="display: none;">
        <p>Tu carrito está vacío.</p>
        <a href="{{ url_for('customer.menu') }}" class="btn btn-danger">Ver Menú</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const DELIVERY_COST = {{ config.DELIVERY_COST }};
    const CURRENCY = "{{ config.CURRENCY }}";

    function renderCartPage() {
        const container = document.getElementById('cart-items');
        const summaryContainer = document.getElementById('cart-summary');
        const emptyMessage = document.getElementById('cart-empty');

        if (!container) return; // No estamos en la página del carrito

        const cart = getCart();

        if (cart.length === 0) {
            container.innerHTML = '';
            summaryContainer.innerHTML = '';
            emptyMessage.style.display = 'block';
            return;
        }

        emptyMessage.style.display = 'none';

        let html = '';
        let subtotal = 0;

        cart.forEach(item => {
            const itemSubtotal = item.price * item.quantity;
            subtotal += itemSubtotal;

            html += `
                <div class="d-flex justify-content-between align-items-center border-bottom py-3">
                    <div>
                        <strong>${item.name}</strong><br>
                        <span class="text-muted">${CURRENCY} ${item.price.toFixed(2)} c/u</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-sm btn-outline-secondary" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                        <span>${item.quantity}</span>
                        <button class="btn btn-sm btn-outline-secondary" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                        <button class="btn btn-sm btn-link text-danger" onclick="removeFromCart(${item.id})">Eliminar</button>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;

        const total = subtotal + DELIVERY_COST;

        summaryContainer.innerHTML = `
            <div class="d-flex justify-content-between"><span>Subtotal</span><span>${CURRENCY} ${subtotal.toFixed(2)}</span></div>
            <div class="d-flex justify-content-between"><span>Delivery</span><span>${CURRENCY} ${DELIVERY_COST.toFixed(2)}</span></div>
            <div class="d-flex justify-content-between fw-bold fs-5 mt-2"><span>Total</span><span>${CURRENCY} ${total.toFixed(2)}</span></div>

            <a href="${'/checkout'}" class="btn btn-danger w-100 mt-3">Confirmar Pedido</a>
            <button class="btn btn-outline-secondary w-100 mt-2" onclick="clearCart()">Vaciar Carrito</button>
        `;
    }

    document.addEventListener('DOMContentLoaded', renderCartPage);
</script>
{% endblock %}
