{% extends "base.html" %}

{% block title %}{{ 'Editar' if product else 'Nuevo' }} Producto - {{ config.BUSINESS_NAME }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 500px;">
    <h3 class="mb-4">{{ 'Editar' if product else 'Nuevo' }} Producto</h3>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="name" class="form-control" required
                   value="{{ product.name if product else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea name="description" class="form-control" rows="2">{{ product.description if product else '' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" min="0" name="price" class="form-control" required
                   value="{{ product.price if product else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select name="category_id" class="form-select" required>
                {% for category in categories %}
                <option value="{{ category.id }}"
                    {% if product and product.category_id == category.id %}selected{% endif %}>
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Imagen (nombre de archivo, ej: hamburguesa.jpg)</label>
            <input type="text" name="image" class="form-control"
                   value="{{ product.image if product else '' }}">
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" name="active" class="form-check-input" id="active"
                   {% if not product or product.active %}checked{% endif %}>
            <label class="form-check-label" for="active">Producto activo</label>
        </div>

        <button type="submit" class="btn btn-dark w-100">Guardar</button>
    </form>
</div>
{% endblock %}
