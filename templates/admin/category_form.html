{% extends "base.html" %}

{% block title %}{{ 'Editar' if category else 'Nueva' }} Categoría - {{ config.BUSINESS_NAME }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 500px;">
    <h3 class="mb-4">{{ 'Editar' if category else 'Nueva' }} Categoría</h3>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="name" class="form-control" required
                   value="{{ category.name if category else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea name="description" class="form-control" rows="2">{{ category.description if category else '' }}</textarea>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" name="active" class="form-check-input" id="active"
                   {% if not category or category.active %}checked{% endif %}>
            <label class="form-check-label" for="active">Categoría activa</label>
        </div>

        <button type="submit" class="btn btn-dark w-100">Guardar</button>
    </form>
</div>
{% endblock %}
